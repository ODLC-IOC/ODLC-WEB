[build]
  publish = "."


[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Tarjeta digital, tarjeta QR y reuniones: fuera de buscadores
[[headers]]
  for = "/vcard_ioc*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/qr_ioc*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/assets/descargas/*.vcf"
  [headers.values]
    Content-Type = "text/vcard; charset=utf-8"
    Content-Disposition = "attachment; filename=\"Isabel-Olivares-de-la-Cerda-OdlC.vcf\""
    X-Robots-Tag = "noindex"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Antiguas URLs del Método/Índice ORDEN
[[redirects]]
  from = "/metodo-orden.html"
  to = "/metodo-odlc.html"
  status = 301

[[redirects]]
  from = "/indice-orden.html"
